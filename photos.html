<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    
    <style>
        /* Изолированные стили только для этой страницы, чтобы ничего не ломалось */
        body.gallery-body {
            background: #141414 !important;
            color: #fff !important;
            padding: 40px 20px !important;
            margin: 0 !important;
            min-height: 100vh !important;
            font-family: 'Montserrat', sans-serif;
        }

        .gallery-header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        /* Кнопка назад (овальная) */
        .btn-back {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid #fff;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s, color 0.2s;
        }
        .btn-back:hover {
            background: #22c55e;
            border-color: #22c55e;
        }

        .gallery-header h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* НАДЁЖНАЯ СЕТКА: Исключает любые наложения */
        .gallery-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
            gap: 20px !important;
            max-width: 1200px;
            margin: 0 auto !important;
            padding: 0 !important;
            position: relative !important;
        }

        /* Квадратная иконка-контейнер */
        .gallery-item-icon {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            aspect-ratio: 1 / 1 !important; /* Делает квадратными */
            overflow: hidden !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1) !important;
            transition: transform 0.2s ease, border-color 0.2s ease;
            
            /* Сброс возможных глобальных конфликтов */
            top: auto !important;
            left: auto !important;
            transform: none;
        }

        .gallery-item-icon:hover {
            transform: scale(1.05) !important;
            border-color: #22c55e !important;
        }

        /* Жёстко чиним саму картинку внутри иконки */
        .gallery-item-icon img {
            position: absolute !important; /* Чтобы object-fit сработал корректно */
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important; /* Заполняет квадрат без искажений */
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ПОЛНОЭКРАННЫЙ РЕЖИМ */
        .full-view-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(10, 10, 10, 0.95) !important;
            z-index: 9999 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 20px !important;
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .full-view-overlay.visible {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .full-view-overlay img {
            max-width: 90% !important;
            max-height: 85vh !important;
            object-fit: contain !important;
            border-radius: 6px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7) !important;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            
            /* Сброс старых стилей */
            position: relative !important;
            width: auto !important;
            height: auto !important;
        }

        .full-view-overlay.visible img {
            transform: scale(1) !important;
        }

        .close-full-view {
            position: absolute !important;
            top: 25px !important;
            right: 35px !important;
            color: #fff !important;
            font-size: 40px !important;
            font-weight: bold !important;
            cursor: pointer !important;
        }
        .close-full-view:hover {
            color: #22c55e !important;
        }
    </style>
</head>
<body class="gallery-body">

    <div class="gallery-header">
        <a href="index.html" class="btn-back">&larr; На главную</a>
        <h1>Галерея</h1>
    </div>

    <div class="gallery-grid">
        <div class="gallery-item-icon"><img src="images/img1.jpg" alt="Фото 1"></div>
        <div class="gallery-item-icon"><img src="images/img2.jpg" alt="Фото 2"></div>
        <div class="gallery-item-icon"><img src="images/img3.jpg" alt="Фото 3"></div>
        <div class="gallery-item-icon"><img src="images/img2.2.jpg" alt="Фото 4"></div>
        <div class="gallery-item-icon"><img src="images/img2.3.jpg" alt="Фото 5"></div>
        <div class="gallery-item-icon"><img src="images/img4 leibl.jpg" alt="Фото 6"></div>
    </div>

    <div class="full-view-overlay" id="fullViewOverlay">
        <span class="close-full-view" id="closeFullView">&times;</span>
        <img src="" id="fullViewImg" alt="Крупный план">
    </div>

    <script>
        const overlay = document.getElementById('fullViewOverlay');
        const fullImg = document.getElementById('fullViewImg');
        const closeBtn = document.getElementById('closeFullView');
        const icons = document.querySelectorAll('.gallery-item-icon img');

        icons.forEach(icon => {
            icon.addEventListener('click', () => {
                fullImg.src = icon.src;
                overlay.classList.add('visible');
            });
        });

        closeBtn.addEventListener('click', () => overlay.classList.remove('visible'));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('visible');
        });
    </script>
</body>
</html>
